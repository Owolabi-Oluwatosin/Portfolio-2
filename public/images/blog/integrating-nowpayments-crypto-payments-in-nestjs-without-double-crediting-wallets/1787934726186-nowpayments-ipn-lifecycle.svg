<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NOWPayments IPN lifecycle: verify signature, return 200 fast, enqueue to BullMQ, credit once, reconcile via cron">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .card{fill:#16213A;stroke:#2B3A5B;stroke-width:1.5;}
      .title{fill:#E2E8F0;font-family:'Segoe UI',system-ui,sans-serif;font-weight:700;}
      .sub{fill:#94A3B8;font-family:'Segoe UI',system-ui,sans-serif;}
      .nlabel{fill:#E2E8F0;font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:20px;}
      .ncode{fill:#94A3B8;font-family:'JetBrains Mono','SFMono-Regular',monospace;font-size:13px;}
      .badge{font-family:'JetBrains Mono',monospace;font-weight:700;}
    </style>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#1E2A44" stroke-width="1"/>

  <!-- heading -->
  <text x="48" y="72" class="title" font-size="30">NOWPayments IPN lifecycle</text>
  <text x="48" y="104" class="sub" font-size="17">verify signature → return 200 fast → enqueue → credit once → reconcile</text>

  <!-- main flow line (behind nodes) -->
  <line x1="190" y1="240" x2="1010" y2="240" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="10 12" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- reconciliation loop path (drawn under, curves below the row) -->
  <path id="recon" d="M1085,279 C1085,410 697,410 697,279" fill="none"
        stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="6 10" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="891" y="404" text-anchor="middle" class="ncode" fill="#2DD4BF">reconcile cron · every 5 min · idempotent</text>

  <!-- ===== NODES ===== y=201..279, cy=240 -->
  <!-- N1 NOWPayments -->
  <g>
    <rect x="40" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="40" y="201" width="6" height="78" rx="3" fill="#22D3EE"/>
    <text x="115" y="236" text-anchor="middle" class="nlabel">NOWPayments</text>
    <text x="115" y="260" text-anchor="middle" class="ncode">IPN callback</text>
  </g>
  <!-- N2 Verify -->
  <g>
    <rect x="234" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="234" y="201" width="6" height="78" rx="3" fill="#F59E0B"/>
    <text x="309" y="236" text-anchor="middle" class="nlabel">Verify sig</text>
    <text x="309" y="260" text-anchor="middle" class="ncode">sorted-key HMAC</text>
    <!-- pulse ring when packet passes -->
    <circle cx="309" cy="240" r="22" fill="none" stroke="#F59E0B" stroke-width="2">
      <animate attributeName="r" values="22;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- N3 Webhook 200 -->
  <g>
    <rect x="428" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="428" y="201" width="6" height="78" rx="3" fill="#34D399"/>
    <text x="503" y="236" text-anchor="middle" class="nlabel">Webhook</text>
    <text x="503" y="260" text-anchor="middle" class="ncode">return 200 fast</text>
  </g>
  <!-- N4 BullMQ -->
  <g>
    <rect x="622" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="622" y="201" width="6" height="78" rx="3" fill="#A78BFA"/>
    <text x="697" y="236" text-anchor="middle" class="nlabel">BullMQ</text>
    <text x="697" y="260" text-anchor="middle" class="ncode">enqueue · jobId dedup</text>
  </g>
  <!-- N5 Worker credit once -->
  <g>
    <rect x="816" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="816" y="201" width="6" height="78" rx="3" fill="#34D399"/>
    <text x="891" y="236" text-anchor="middle" class="nlabel">Worker</text>
    <text x="891" y="260" text-anchor="middle" class="ncode">creditedAt guard</text>
  </g>
  <!-- N6 Wallet -->
  <g>
    <rect x="1010" y="201" width="150" height="78" rx="12" class="card"/>
    <rect x="1010" y="201" width="6" height="78" rx="3" fill="#22D3EE"/>
    <text x="1085" y="236" text-anchor="middle" class="nlabel">Wallet</text>
    <text x="1085" y="260" text-anchor="middle" class="ncode">+ append-only ledger</text>
  </g>

  <!-- credit-once stamp above worker -->
  <g transform="translate(891,168)">
    <rect x="-52" y="-18" width="104" height="30" rx="15" fill="#0B1120" stroke="#34D399" stroke-width="1.5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="2" text-anchor="middle" class="badge" font-size="14" fill="#34D399" dominant-baseline="middle">
      credited ✓ once
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- price_amount note above line -->
  <text x="600" y="150" text-anchor="middle" class="ncode" fill="#64748B">credits locked-in price_amount — never actually_paid</text>

  <!-- ===== ANIMATED PACKETS ===== -->
  <!-- main callback packet A -->
  <g filter="url(#glow)">
    <circle r="11" fill="#34D399" stroke="#0B1120" stroke-width="2"/>
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" path="M190,240 L1010,240"/>
  </g>
  <!-- main callback packet B (offset for continuous flow) -->
  <g filter="url(#glow)">
    <circle r="11" fill="#22D3EE" stroke="#0B1120" stroke-width="2"/>
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear" path="M190,240 L1010,240"/>
  </g>

  <!-- fast 200 return: shoots from webhook back to NOWPayments once per cycle -->
  <g>
    <circle r="8" fill="#34D399" stroke="#0B1120" stroke-width="2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.18;0.24;0.98;1" dur="4s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
    <animateMotion dur="4s" begin="0.55s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;1;1" keyTimes="0;0.18;1" path="M503,201 Q309,120 115,201"/>
  </g>
  <text x="309" y="112" text-anchor="middle" class="ncode" fill="#34D399" opacity="0.8">200 received</text>

  <!-- reconciliation packet: travels wallet -> worker along the loop, once per cycle -->
  <g>
    <circle r="8" fill="#2DD4BF" stroke="#0B1120" stroke-width="2">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.6;0.95;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;0.55;0.9;1" path="M1085,279 C1085,410 697,410 697,279"/>
  </g>

  <!-- footer tag -->
  <text x="1160" y="600" text-anchor="end" class="ncode" fill="#475569">danielood.com</text>
</svg>
