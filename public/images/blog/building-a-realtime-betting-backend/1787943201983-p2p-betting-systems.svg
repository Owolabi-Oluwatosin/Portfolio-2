<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three systems of a peer-to-peer betting backend: a matching engine that pairs bets without double-matching, an idempotent proportional settlement job, and a BullMQ Redis queue that dedupes webhooks">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D2E0EF" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
    <style>
      .ink{fill:#17324D;font-family:'Segoe UI',system-ui,sans-serif;}
      .muted{fill:#5B7089;font-family:'Segoe UI',system-ui,sans-serif;}
      .mono{font-family:'JetBrains Mono',monospace;}
      .card{fill:#FFFFFF;stroke:#B7C7DA;stroke-width:1.5;}
      .cap{opacity:0;}
      #zoneA:target .cap, #zoneA:target .focus{opacity:1;}
      #zoneB:target .cap, #zoneB:target .focus{opacity:1;}
      #zoneC:target .cap, #zoneC:target .focus{opacity:1;}
      .focus{opacity:0;transition:opacity .25s;}
      .tab{cursor:pointer;}
      .tab rect{fill:#FFFFFF;stroke:#B7C7DA;stroke-width:1.5;}
      .tab text{font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:14px;}
    </style>
  </defs>

  <!-- blueprint background -->
  <rect width="1200" height="640" fill="#EAF1F8"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <rect x="16" y="16" width="1168" height="608" rx="18" fill="none" stroke="#9DB4CE" stroke-width="1.5"/>

  <text x="44" y="60" class="ink" font-size="26" font-weight="700">Peer-to-peer betting: three systems doing the real work</text>
  <text x="44" y="86" class="muted" font-size="15">the sockets broadcast results — these hold the truth · click a system to focus it</text>

  <!-- lifecycle line across the top of the three cards -->
  <line x1="219" y1="128" x2="980" y2="128" stroke="#9DB4CE" stroke-width="2" stroke-dasharray="7 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <circle r="8" fill="#0EA5A0" stroke="#EAF1F8" stroke-width="2">
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" path="M219,128 L980,128"/>
  </circle>
  <!-- inter-card arrows -->
  <path d="M400,300 l16,0 m-6,-5 l6,5 l-6,5" fill="none" stroke="#5B7089" stroke-width="2"/>
  <path d="M781,300 l16,0 m-6,-5 l6,5 l-6,5" fill="none" stroke="#5B7089" stroke-width="2"/>

  <!-- ============ ZONE A: MATCHING ENGINE ============ -->
  <g id="zoneA">
    <rect class="focus" x="34" y="134" width="369" height="392" rx="16" fill="none" stroke="#0EA5A0" stroke-width="3"/>
    <rect class="card" filter="url(#soft)" x="40" y="140" width="357" height="380" rx="14"/>
    <rect x="40" y="140" width="357" height="6" rx="3" fill="#0EA5A0"/>
    <text x="64" y="180" class="ink" font-size="18" font-weight="700">Matching engine</text>
    <text x="64" y="202" class="muted mono" font-size="12">pairs lay ↔ back · never double-matches</text>

    <!-- back + lay tokens converge and lock -->
    <text x="110" y="250" text-anchor="middle" class="muted mono" font-size="11">back</text>
    <text x="110" y="450" text-anchor="middle" class="muted mono" font-size="11">lay</text>

    <circle r="20" fill="#DFF6F4" stroke="#0EA5A0" stroke-width="2">
      <animate attributeName="cx" values="110;210;210;110" keyTimes="0;0.28;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="278;340;340;278" keyTimes="0;0.28;0.85;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="#FDEBEC" stroke="#E5484D" stroke-width="2">
      <animate attributeName="cx" values="110;210;210;110" keyTimes="0;0.28;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;340;340;420" keyTimes="0;0.28;0.85;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <!-- matched pill -->
    <g>
      <rect x="250" y="322" width="118" height="36" rx="18" fill="#0EA5A0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.35;0.85;0.9" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="309" y="345" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="13" font-weight="700">🔗 matched
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.35;0.85;0.9" dur="4.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- static invariants -->
    <text x="64" y="486" class="muted mono" font-size="11.5">⇄ currency-equivalent   ⊘ one match per bet</text>

    <text class="cap muted" x="64" y="552" font-size="13">Claims the bet inside the read transaction — a second matcher can't take it.</text>
  </g>

  <!-- ============ ZONE B: SETTLEMENT JOB ============ -->
  <g id="zoneB">
    <rect class="focus" x="415" y="134" width="369" height="392" rx="16" fill="none" stroke="#E08A00" stroke-width="3"/>
    <rect class="card" filter="url(#soft)" x="421" y="140" width="357" height="380" rx="14"/>
    <rect x="421" y="140" width="357" height="6" rx="3" fill="#E08A00"/>
    <text x="445" y="180" class="ink" font-size="18" font-weight="700">Settlement job</text>
    <text x="445" y="202" class="muted mono" font-size="12">scheduled · proportional · idempotent</text>

    <!-- net pool -->
    <circle cx="500" cy="330" r="42" fill="#FDF0DA" stroke="#E08A00" stroke-width="2"/>
    <text x="500" y="326" text-anchor="middle" class="ink mono" font-size="12" font-weight="700">net</text>
    <text x="500" y="342" text-anchor="middle" class="ink mono" font-size="12" font-weight="700">pool</text>

    <!-- proportional shares grow -->
    <g class="mono" font-size="11">
      <text x="576" y="286" class="muted">winner A</text>
      <rect x="576" y="292" height="16" rx="4" fill="#E08A00" width="0">
        <animate attributeName="width" values="0;150;150;0" keyTimes="0;0.42;0.85;0.95" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="576" y="330" class="muted">winner B</text>
      <rect x="576" y="336" height="16" rx="4" fill="#E08A00" width="0">
        <animate attributeName="width" values="0;96;96;0" keyTimes="0;0.42;0.85;0.95" dur="4.6s" begin="0.1s" repeatCount="indefinite"/>
      </rect>
      <text x="576" y="374" class="muted">winner C</text>
      <rect x="576" y="380" height="16" rx="4" fill="#E08A00" width="0">
        <animate attributeName="width" values="0;54;54;0" keyTimes="0;0.42;0.85;0.95" dur="4.6s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- retry / idempotent stamp -->
    <g>
      <path d="M470,438 a34,20 0 1 0 60,0" fill="none" stroke="#5B7089" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M528,432 l4,10 l-11,-2" fill="none" stroke="#5B7089" stroke-width="2"/>
      <text x="560" y="452" class="mono" font-size="12" fill="#12A150" font-weight="700">retry → settledAt ✓ (never twice)</text>
    </g>
    <text x="445" y="486" class="muted mono" font-size="11.5">yourShare = (stake / winningStakes) × netPool</text>

    <text class="cap muted" x="445" y="552" font-size="13">Pays behind a settledAt stamp in one transaction — safe to run again.</text>
  </g>

  <!-- ============ ZONE C: QUEUE LAYER ============ -->
  <g id="zoneC">
    <rect class="focus" x="796" y="134" width="369" height="392" rx="16" fill="none" stroke="#5B6EE1" stroke-width="3"/>
    <rect class="card" filter="url(#soft)" x="802" y="140" width="357" height="380" rx="14"/>
    <rect x="802" y="140" width="357" height="6" rx="3" fill="#5B6EE1"/>
    <text x="826" y="180" class="ink" font-size="18" font-weight="700">Queue layer</text>
    <text x="826" y="202" class="muted mono" font-size="12">BullMQ + Redis · webhook-safe · reconciled</text>

    <!-- redis cylinder -->
    <g>
      <ellipse cx="890" cy="270" rx="42" ry="12" fill="#E7EAFB" stroke="#5B6EE1" stroke-width="2"/>
      <path d="M848,270 v70 a42,12 0 0 0 84,0 v-70" fill="#E7EAFB" stroke="#5B6EE1" stroke-width="2"/>
      <ellipse cx="890" cy="270" rx="42" ry="12" fill="#EEF1FE" stroke="#5B6EE1" stroke-width="2"/>
      <text x="890" y="320" text-anchor="middle" class="mono" font-size="12" fill="#5B6EE1" font-weight="700">Redis</text>
    </g>

    <!-- two webhooks arrive: first ok, second deduped -->
    <g>
      <rect x="990" y="250" width="120" height="40" rx="8" fill="#EAF7EF" stroke="#12A150" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" values="0 -90;0 0;0 0;0 -90" keyTimes="0;0.3;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="1050" y="275" text-anchor="middle" class="mono" font-size="12" fill="#12A150" font-weight="700">webhook ✓
        <animateTransform attributeName="transform" type="translate" values="0 -90;0 0;0 0;0 -90" keyTimes="0;0.3;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="990" y="320" width="120" height="40" rx="8" fill="#FDEBEC" stroke="#E5484D" stroke-width="2" stroke-dasharray="5 5">
        <animateTransform attributeName="transform" type="translate" values="0 -90;0 -90;0 0;0 0;0 -90" keyTimes="0;0.35;0.5;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="1050" y="345" text-anchor="middle" class="mono" font-size="11.5" fill="#E5484D" font-weight="700">dup → deduped
        <animateTransform attributeName="transform" type="translate" values="0 -90;0 -90;0 0;0 0;0 -90" keyTimes="0;0.35;0.5;0.85;1" dur="4.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="826" y="430" class="muted mono" font-size="11.5">jobId dedup + creditedAt guard</text>
    <text x="826" y="452" class="muted mono" font-size="11.5">↻ reconcile sweep → converges, never doubles</text>

    <text class="cap muted" x="826" y="552" font-size="13">Return 200 fast, credit in a worker behind an idempotency guard.</text>
  </g>

  <!-- ============ TOGGLE TABS ============ -->
  <a href="#zoneA" class="tab"><g transform="translate(44,566)">
    <rect x="0" y="0" width="240" height="40" rx="10"/>
    <text x="120" y="26" text-anchor="middle" fill="#0EA5A0">◐ matching engine</text></g></a>
  <a href="#zoneB" class="tab"><g transform="translate(300,566)">
    <rect x="0" y="0" width="240" height="40" rx="10"/>
    <text x="120" y="26" text-anchor="middle" fill="#E08A00">◐ settlement job</text></g></a>
  <a href="#zoneC" class="tab"><g transform="translate(556,566)">
    <rect x="0" y="0" width="240" height="40" rx="10"/>
    <text x="120" y="26" text-anchor="middle" fill="#5B6EE1">◐ queue layer</text></g></a>

  <text x="1156" y="592" text-anchor="end" class="muted mono" font-size="12">danielood.com</text>
</svg>
