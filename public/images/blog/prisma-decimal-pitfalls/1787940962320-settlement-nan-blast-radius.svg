<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A settlement pipeline where a NaN contaminates each stage and surfaces days later, versus a boundary-normalized pipeline that stays correct">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{fill:#E2E8F0;font-family:'Segoe UI',system-ui,sans-serif;font-weight:700;}
      .sub{fill:#94A3B8;font-family:'Segoe UI',system-ui,sans-serif;}
      .lane{fill:#94A3B8;font-family:'JetBrains Mono',monospace;font-size:14px;}
      .stage{fill:#CBD5E1;font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:13px;}
      .code{fill:#94A3B8;font-family:'JetBrains Mono',monospace;font-size:12px;}
      .card{fill:#16213A;stroke:#2B3A5B;stroke-width:1.5;}
      .stat{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}

      #lane-good{opacity:.30;}
      #lane-bad:target{opacity:1;}
      #lane-good:target{opacity:1;}
      #lane-good:target ~ #lane-bad{opacity:.30;}

      .tab{cursor:pointer;}
      .tab rect{fill:#0F1A30;stroke:#2B3A5B;stroke-width:1.5;}
      .tab text{font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:15px;fill:#CBD5E1;}
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="580" rx="20" fill="none" stroke="#1E2A44"/>

  <text x="48" y="66" class="title" font-size="27">Blast radius of a silent NaN</text>
  <text x="48" y="93" class="sub" font-size="15">one job, five stages · nothing throws · click a lane to spotlight it</text>

  <!-- ============ BAD LANE ============ y ~ 150 -->
  <g id="lane-bad">
    <text x="48" y="150" class="lane" fill="#F87171">❌ raw Decimal — NaN contaminates everything downstream</text>

    <!-- connector -->
    <line x1="130" y1="205" x2="1070" y2="205" stroke="#3a2330" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- 5 stages: centers 130,365,600,835,1070 ; card w=180 -->
    <!-- stage template repeated; red overlay fades in as the coin passes -->
    <!-- S1 -->
    <g>
      <rect x="40" y="176" width="180" height="58" rx="11" class="card"/>
      <text x="130" y="200" text-anchor="middle" class="stage">stake + bonus</text>
      <text x="130" y="222" text-anchor="middle" class="code" id="s1t">Decimal + Decimal</text>
      <rect x="40" y="176" width="180" height="58" rx="11" fill="none" stroke="#F87171" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.06;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S2 -->
    <g>
      <rect x="275" y="176" width="180" height="58" rx="11" class="card"/>
      <text x="365" y="200" text-anchor="middle" class="stage">settlement calc</text>
      <text x="365" y="222" text-anchor="middle" class="code">payout = f(total)</text>
      <rect x="275" y="176" width="180" height="58" rx="11" fill="rgba(248,113,113,.10)" stroke="#F87171" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.29;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="365" y="222" text-anchor="middle" class="stat" fill="#F87171">→ NaN
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.29;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- S3 -->
    <g>
      <rect x="510" y="176" width="180" height="58" rx="11" class="card"/>
      <text x="600" y="200" text-anchor="middle" class="stage">payout math</text>
      <text x="600" y="222" text-anchor="middle" class="stat" fill="#F87171">NaN * odds = NaN
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="510" y="176" width="180" height="58" rx="11" fill="none" stroke="#F87171" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S4 -->
    <g>
      <rect x="745" y="176" width="180" height="58" rx="11" class="card"/>
      <text x="835" y="200" text-anchor="middle" class="stage">ledger write</text>
      <text x="835" y="222" text-anchor="middle" class="stat" fill="#F87171">amount: NaN
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.79;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="745" y="176" width="180" height="58" rx="11" fill="none" stroke="#F87171" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.79;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S5 -->
    <g>
      <rect x="980" y="176" width="180" height="58" rx="11" class="card"/>
      <text x="1070" y="200" text-anchor="middle" class="stage">user balance</text>
      <text x="1070" y="222" text-anchor="middle" class="stat" fill="#F87171">NaN
        <animate attributeName="opacity" values="0;0;1;0.4;1" keyTimes="0;0.95;0.97;0.985;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="980" y="176" width="180" height="58" rx="11" fill="none" stroke="#F87171" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.95;0.97;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- "no error thrown" + days-later beat -->
    <text x="130" y="258" class="code" fill="#64748B">job reports success · no exception</text>
    <text x="1070" y="258" text-anchor="middle" class="code" fill="#F87171">⏱ surfaces days later
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.95;1" dur="4.4s" repeatCount="indefinite"/>
    </text>

    <!-- travelling coin: cyan → red at the settlement calc -->
    <circle r="10" stroke="#0B1120" stroke-width="2" filter="url(#glow)">
      <animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M130,205 L1070,205"/>
      <animate attributeName="fill" values="#22D3EE;#22D3EE;#F87171;#F87171" keyTimes="0;0.23;0.29;1" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- divider -->
  <line x1="48" y1="330" x2="1152" y2="330" stroke="#1E2A44" stroke-dasharray="4 8"/>

  <!-- ============ GOOD LANE ============ y ~ 380 -->
  <g id="lane-good">
    <text x="48" y="380" class="lane" fill="#34D399">✅ toNum() boundary — converted once, stays a real number everywhere</text>

    <line x1="130" y1="435" x2="1070" y2="435" stroke="#1e3a30" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- S1 with inline boundary marker -->
    <g>
      <rect x="40" y="406" width="180" height="58" rx="11" class="card" stroke="#34D399"/>
      <rect x="40" y="406" width="6" height="58" rx="3" fill="#34D399"/>
      <text x="130" y="430" text-anchor="middle" class="stage">toNum(stake)+toNum(bonus)</text>
      <text x="130" y="452" text-anchor="middle" class="code" fill="#34D399">Decimal → number</text>
      <rect x="40" y="406" width="180" height="58" rx="11" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.06;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S2 -->
    <g>
      <rect x="275" y="406" width="180" height="58" rx="11" class="card"/>
      <text x="365" y="430" text-anchor="middle" class="stage">settlement calc</text>
      <text x="365" y="452" text-anchor="middle" class="stat" fill="#34D399">payout = 55.00
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.29;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="275" y="406" width="180" height="58" rx="11" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.29;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S3 -->
    <g>
      <rect x="510" y="406" width="180" height="58" rx="11" class="card"/>
      <text x="600" y="430" text-anchor="middle" class="stage">payout math</text>
      <text x="600" y="452" text-anchor="middle" class="stat" fill="#34D399">55.00 * odds ✓
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="510" y="406" width="180" height="58" rx="11" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S4 -->
    <g>
      <rect x="745" y="406" width="180" height="58" rx="11" class="card"/>
      <text x="835" y="430" text-anchor="middle" class="stage">ledger write</text>
      <text x="835" y="452" text-anchor="middle" class="stat" fill="#34D399">amount: 55.00
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.79;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="745" y="406" width="180" height="58" rx="11" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.79;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- S5 -->
    <g>
      <rect x="980" y="406" width="180" height="58" rx="11" class="card"/>
      <text x="1070" y="430" text-anchor="middle" class="stage">user balance</text>
      <text x="1070" y="452" text-anchor="middle" class="stat" fill="#34D399">55.00
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.95;0.97;1" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <rect x="980" y="406" width="180" height="58" rx="11" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.95;0.97;1" dur="4.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="1070" y="488" text-anchor="middle" class="code" fill="#34D399">✓ correct — the bad shape never crossed the seam</text>

    <!-- coin: cyan → green at the boundary -->
    <circle r="10" stroke="#0B1120" stroke-width="2" filter="url(#glow)">
      <animateMotion dur="4.4s" repeatCount="indefinite" calcMode="linear" path="M130,435 L1070,435"/>
      <animate attributeName="fill" values="#22D3EE;#34D399;#34D399" keyTimes="0;0.06;1" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ TOGGLE ============ -->
  <a href="#lane-bad" class="tab">
    <g transform="translate(48,540)">
      <rect x="0" y="0" width="250" height="42" rx="10"/>
      <text x="125" y="27" text-anchor="middle">❌ spotlight the incident</text>
    </g>
  </a>
  <a href="#lane-good" class="tab">
    <g transform="translate(316,540)">
      <rect x="0" y="0" width="250" height="42" rx="10"/>
      <text x="125" y="27" text-anchor="middle">✅ spotlight the fix</text>
    </g>
  </a>
  <text x="1152" y="568" text-anchor="end" class="code" fill="#475569">danielood.com</text>
</svg>
